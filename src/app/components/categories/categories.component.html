<div class="m-3 p-3 my-4 d-flex flex-wrap justify-content-center bg-white rounded-2 shadow-lg">
    <h3 class="my-2">Categories</h3>
    @for (category of categories(); track category) {
        <div class="d-flex align-items-center justify-content-center">
            <button type="button" class="btn btn-dark shadow m-2 d-inline-block" 
            (click)="selectCategory(category)">
                {{ category }}
            </button>
        </div>
    }
</div>
