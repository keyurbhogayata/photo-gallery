<div *ngIf="image() as selectedImage; else loadingTemplate">
    <div class="mw-100 m-4 bg-white rounded-2 p-2 shadow-lg">
        <img class="mw-100 p-2 rounded-2" [src]="selectedImage.url" [alt]="selectedImage.title">
        <h5 class="text-center">
            {{ selectedImage.title }}
        </h5>
    </div>
    
    <div class="m-4 bg-white rounded-2 p-2 shadow-lg">
        <div class="d-block m-2">
            <label for="update-image-url">Update Image URL:</label>
            <input class="form-control" id="update-image-url" [(ngModel)]="selectedImage.url" />
        </div>
        
        <div class="d-block m-2">
            <label for="image-name">Image Name:</label>
            <input class="form-control" id="image-name" [(ngModel)]="selectedImage.title" placeholder="Image Name" />
        </div>
        
        <div class="d-block m-2">
            <label for="image-description">Description:</label>
            <input class="form-control" id="image-description" [(ngModel)]="selectedImage.description" placeholder="Image description" />
        </div>
        
        <div class="d-block m-2">
            <label for="image-category">Category:</label>
            <input class="form-control" id="image-category" [(ngModel)]="selectedImage.category" placeholder="Image category" />
        </div>
        
        <div class="d-flex align-items-center justify-content-center">
            <button type="button" class="btn btn-dark m-2" (click)="goBack()">Go Back</button>
            <button type="button" class="btn btn-dark m-2" (click)="save()">Save</button>
            <button type="button" class="btn btn-dark m-2" title="Delete image" (click)="deleteImage(selectedImage.id)">Delete</button>
        </div>
    </div>
</div>

<ng-template #loadingTemplate>
    <div class="text-center m-5">
        <h1>Loading...</h1>
    </div>
</ng-template>
